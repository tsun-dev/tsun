# Tsun Security Scan - GitHub Actions Template
# Free Tier: CI profile, JSON/SARIF output, basic exit gating
# Pro adds: Baseline comparison, HTML reports, noise reduction
#
# NOTE: This is a TEMPLATE for users of Tsun, not meant to run on this repository itself.
# Disable this workflow for the Tsun repository itself.

name: Tsun Security Scan (Template - Disabled)

on:
  workflow_dispatch: # Manual trigger only
  # Uncomment below to enable automatic scanning in your application repository:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  # schedule:
  #   - cron: '0 2 * * 1'  # Weekly scans

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      security-events: write # For SARIF upload (free tier)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Tsun
        run: |
          # Download and install latest Tsun release
          # Visit https://github.com/tsun-dev/tsun/releases for available versions
          curl -L https://github.com/tsun-dev/tsun/releases/latest/download/tsun-linux-x86_64.tar.gz | tar xz
          chmod +x tsun
          sudo mv tsun /usr/local/bin/
      
      - name: Verify installation
        run: tsun doctor
      
      - name: Restore baseline from main
        uses: actions/download-artifact@v4
        with:
          name: security-baseline
        continue-on-error: true

      - name: Run security scan
        run: |
          # Gate on findings introduced by this change, not the whole backlog.
          # Drop --baseline/--fail-on-new to gate on every finding instead.
          tsun scan \
            --target ${{ vars.APP_URL || 'https://staging.example.com' }} \
            --profile ci \
            --format sarif \
            --output results.sarif \
            --baseline baseline.json \
            --fail-on-new \
            --exit-on-severity high

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Publish new baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: security-baseline
          path: results.sarif

# Notes:
# - --engine defaults to zap (Docker-managed). Use --engine mock only to test
#   this workflow's wiring; it fabricates findings and never contacts the target.
# - For authenticated scans, pass --header / --cookies; they are injected into
#   the requests ZAP sends to the target.
# - Retire accepted findings with ignore rules rather than raising the gate:
#   --ignore plugin:10038, or an `ignore:` block in tsun.yaml.
